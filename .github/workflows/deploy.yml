name: Deploy

# Un solo camino a producción: merge a main. Nada se despliega a mano.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: nutriscann-f809e
  # Autenticación SIN LLAVES (Workload Identity Federation): GitHub presenta un
  # token efímero firmado por sí mismo y GCP lo canjea. No hay ningún secreto
  # guardado en el repo, y la federación solo acepta a este repositorio.
  WIF_PROVIDER: projects/590554450084/locations/global/workloadIdentityPools/github/providers/github-nutriscann
  DEPLOY_SA: github-deploy@nutriscann-f809e.iam.gserviceaccount.com

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm run install:all

      - name: Chequeo de tipos
        run: npm run lint

      # Candados del catálogo que corren sin los datasets (1,1 GB, fuera de git).
      # El único test excluido es pipeline.test.js, que recorre los CSVs de USDA
      # y solo puede correr en una máquina con ../datasets/ presente.
      - name: Candados del catálogo
        run: |
          npm --prefix kb run compile
          node --test $(ls kb/dist/*.test.js | grep -v pipeline.test.js)
          npm --prefix kb/seed test
          python3 kb/curation/tools/verify_curation.py
          python3 kb/curation/tools/build_aliases.py --check

      - name: Compilar
        run: npm run build

  deploy:
    name: Desplegar
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # necesario para pedirle el token OIDC a GitHub
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Autenticarse en GCP (sin llaves)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Instalar dependencias
        run: npm run install:all

      - name: Compilar
        run: npm run build

      # Objetivos del despliegue.
      #
      # `functions` y `storage` requieren el plan Blaze del proyecto, que todavía
      # no está activo. Desplegarlos ahora haría fallar el pipeline por una razón
      # que no es del código. En cuanto Blaze esté activo y Storage inicializado,
      # esta línea pasa a:
      #     --only hosting,firestore,storage,functions
      - name: Desplegar a Firebase
        run: |
          npx --yes firebase-tools@15 deploy \
            --only hosting,firestore \
            --project "$PROJECT_ID" \
            --non-interactive
