<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Fuente de og.png</title>
    <!--
      DE DÓNDE SALE `og.png`.

      Este archivo NO se visita: es el molde desde el que se genera la imagen
      que las redes sociales enseñan al compartir caliscan.app. Se guarda en el
      repo por la misma razón por la que se guarda un script de build — para que
      la imagen se pueda REHACER cuando cambie el claim, en vez de tener que
      redibujarla a mano en un editor.

      POR QUÉ PNG Y NO EL SVG DEL LOGO: los rastreadores de WhatsApp, LinkedIn,
      X y Facebook no renderizan SVG. Una imagen Open Graph tiene que ser un
      mapa de bits, y 1200×630 es la medida que todos recortan bien.

      CÓMO SE REGENERA (desde `apps/landing/`):

        "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
          --headless --disable-gpu --hide-scrollbars \
          --virtual-time-budget=8000 --window-size=1200,630 \
          --screenshot=assets/og.png \
          "file://$PWD/assets/og.source.html"

      El `virtual-time-budget` es lo que le da tiempo a Google Fonts a llegar;
      sin él, la captura sale con la tipografía de respaldo.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=Spline+Sans+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background:
          radial-gradient(52% 62% at 78% 44%, rgba(79, 190, 130, 0.2) 0%, transparent 68%),
          linear-gradient(155deg, #1a2017 0%, #12160f 62%);
        color: #e8ece4;
        font-family: "Instrument Sans", Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
      }

      /* La retícula del escáner, muy tenue, cruzando toda la imagen. */
      .reticula {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(79, 190, 130, 0.09) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(79, 190, 130, 0.09) 1px, transparent 1px);
        background-size: 60px 60px;
        -webkit-mask-image: radial-gradient(80% 80% at 60% 50%, #000 30%, transparent 100%);
        mask-image: radial-gradient(80% 80% at 60% 50%, #000 30%, transparent 100%);
      }

      .contenido {
        position: relative;
        padding: 0 76px;
        display: flex;
        align-items: center;
        gap: 56px;
        width: 100%;
      }

      .texto {
        flex: 1 1 auto;
        min-width: 0;
      }

      .logotipo {
        height: 66px;
        width: auto;
        margin-bottom: 40px;
      }

      h1 {
        margin: 0;
        font-family: "Bricolage Grotesque", Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 60px;
        line-height: 1.06;
        letter-spacing: -0.03em;
        max-width: 15ch;
      }

      h1 em {
        font-style: normal;
        color: #4fbe82;
      }

      p {
        margin: 26px 0 0;
        font-size: 25px;
        line-height: 1.45;
        color: #b3bcae;
        max-width: 26ch;
      }

      .pastilla {
        margin-top: 34px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 11px 22px;
        border: 1px solid #2d362b;
        border-radius: 999px;
        background: rgba(30, 51, 40, 0.6);
        color: #b3bcae;
        font-size: 20px;
      }

      .pastilla span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #4fbe82;
        box-shadow: 0 0 0 4px rgba(79, 190, 130, 0.22);
      }

      .visor {
        flex: none;
        position: relative;
        width: 344px;
        height: 344px;
        border: 1px solid #2d362b;
        border-radius: 34px;
        background:
          radial-gradient(70% 60% at 50% 42%, rgba(79, 190, 130, 0.09), transparent 70%),
          linear-gradient(160deg, #1a2017 0%, #12160f 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 0 20px;
      }

      .esquina {
        position: absolute;
        width: 40px;
        height: 40px;
        border: 3px solid #4fbe82;
        opacity: 0.75;
      }

      .esquina.tl {
        top: 24px;
        left: 24px;
        border-right: 0;
        border-bottom: 0;
        border-top-left-radius: 12px;
      }
      .esquina.tr {
        top: 24px;
        right: 24px;
        border-left: 0;
        border-bottom: 0;
        border-top-right-radius: 12px;
      }
      .esquina.br {
        bottom: 24px;
        right: 24px;
        border-left: 0;
        border-top: 0;
        border-bottom-right-radius: 12px;
      }
      .esquina.bl {
        bottom: 24px;
        left: 24px;
        border-right: 0;
        border-top: 0;
        border-bottom-left-radius: 12px;
      }

      .anillo {
        width: 186px;
        height: 186px;
      }

      .leyenda {
        display: flex;
        gap: 15px;
        font-size: 15px;
        color: #b3bcae;
      }

      .leyenda div {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .leyenda i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
    </style>
  </head>

  <body>
    <div class="reticula"></div>

    <div class="contenido">
      <div class="texto">
        <svg class="logotipo" viewBox="0 0 252 64" role="img" aria-label="CaliScan">
          <defs>
            <linearGradient id="h" x1="18" y1="46" x2="46" y2="18" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#4fbe82" stop-opacity="0.10" />
              <stop offset="1" stop-color="#4fbe82" stop-opacity="0.28" />
            </linearGradient>
            <linearGradient id="b" x1="10" y1="32" x2="54" y2="32" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#4fbe82" stop-opacity="0" />
              <stop offset="0.3" stop-color="#4fbe82" stop-opacity="1" />
              <stop offset="0.7" stop-color="#4fbe82" stop-opacity="1" />
              <stop offset="1" stop-color="#4fbe82" stop-opacity="0" />
            </linearGradient>
          </defs>
          <path
            d="M18 46C18 30 30 18 46 18C46 34 34 46 18 46Z"
            fill="url(#h)" stroke="#4fbe82" stroke-width="2.6" stroke-linejoin="round"
          />
          <path d="M18 46 46 18" stroke="#2f9e63" stroke-width="2.2" stroke-linecap="round" fill="none" />
          <g stroke="url(#b)" stroke-linecap="round" fill="none">
            <path d="M11 32H53" stroke-width="5" opacity="0.22" />
            <path d="M11 32H53" stroke-width="2.2" />
          </g>
          <g fill="none" stroke="#4fbe82" stroke-width="3.4" stroke-linecap="round">
            <path d="M21 4.5H12A7.5 7.5 0 0 0 4.5 12V21" />
            <path d="M43 4.5H52A7.5 7.5 0 0 1 59.5 12V21" />
            <path d="M59.5 43V52A7.5 7.5 0 0 1 52 59.5H43" />
            <path d="M21 59.5H12A7.5 7.5 0 0 1 4.5 52V43" />
          </g>
          <text
            x="78" y="44.5"
            font-family="'Bricolage Grotesque', Helvetica, Arial, sans-serif"
            font-size="37" font-weight="700" letter-spacing="-0.9"
          >
            <tspan fill="#e8ece4">Cali</tspan><tspan fill="#4fbe82">Scan</tspan>
          </text>
        </svg>

        <h1>Haz una foto a tu plato y conoce su <em>valor nutricional</em></h1>
        <p>Calorías, macros y desglose en segundos. Cada número, trazable al USDA.</p>
        <div class="pastilla"><span></span> PWA — sin descargas, en tu navegador</div>
      </div>

      <div class="visor">
        <i class="esquina tl"></i><i class="esquina tr"></i>
        <i class="esquina br"></i><i class="esquina bl"></i>

        <svg class="anillo" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="74" fill="none" stroke="#2d362b" stroke-width="24" />
          <g fill="none" stroke-width="24">
            <circle cx="110" cy="110" r="74" stroke="#ec7b64" stroke-dasharray="133 465" transform="rotate(-90 110 110)" />
            <circle cx="110" cy="110" r="74" stroke="#e7b354" stroke-dasharray="203 465" transform="rotate(17.6 110 110)" />
            <circle cx="110" cy="110" r="74" stroke="#a98fe4" stroke-dasharray="110 465" transform="rotate(179.4 110 110)" />
          </g>
        </svg>

        <div class="leyenda">
          <div><i style="background: #ec7b64"></i>Proteínas</div>
          <div><i style="background: #e7b354"></i>Hidratos</div>
          <div><i style="background: #a98fe4"></i>Grasas</div>
        </div>
      </div>
    </div>
  </body>
</html>
