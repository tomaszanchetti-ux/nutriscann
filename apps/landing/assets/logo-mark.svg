<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="caliscan-mark-titulo">
  <title id="caliscan-mark-titulo">CaliScan</title>
  <!--
    EL ISOTIPO DE CALISCAN.

    Dice el producto entero en un dibujo: un ENCUADRE DE CÁMARA (las cuatro
    esquinas del visor) que apunta a una HOJA (el alimento), y un HAZ DE
    ESCANEO horizontal que la cruza. Foto + comida + medición, en ese orden de
    lectura.

    POR QUÉ ASÍ Y NO OTRA COSA:
    - Las esquinas del visor ya existen en la interfaz (`ScannerDeFoto`), así
      que la marca no inventa un lenguaje visual nuevo: cita el que la app ya
      usa cuando analiza una foto.
    - La hoja, y no un plato con cubiertos: los cubiertos son el cliché del
      sector y a 16 px se convierten en una mancha. La hoja tiene silueta
      propia —se reconoce por el contorno, sin detalle interno— y sostiene el
      verde de la paleta sin pedir prestado ningún otro color.
    - El haz horizontal es la única pieza que se mueve en la app (la línea de
      luz del escaneo) y aquí queda congelada: es lo que separa esta marca de
      cualquier logo de comida sana.

    FONDO OSCURO POR DISEÑO. El lienzo es transparente y todas las tintas son
    claras, para el fondo `ground` #12160f de la app. Sobre fondo claro habría
    que recolorear; no es el caso de uso.

    PALETA — exactamente los tokens de `apps/web/src/index.css`, sin tintas
    nuevas:
      #4fbe82  color-accent       esquinas, haz, borde de la hoja
      #2f9e63  color-accent-deep  nervadura y venas
    El relleno de la hoja es el mismo verde a baja opacidad: un cuerpo, no un
    color más.

    GEOMETRÍA. Lienzo 64×64. Las esquinas viven en el recuadro 4,5 … 59,5 con
    radio 7,5. La hoja va de (18,46) a (46,18) —la diagonal del encuadre— y sus
    bordes bombean 8,5 unidades a cada lado. El haz cruza a media altura (y=32),
    que es justo el centro de la hoja: por eso parece que la está midiendo.

    NO SE PARECE A NADA DEL VECINDARIO: el otro escáner nutricional del mercado
    es tipografía negra sobre verde lima. Esto es lo contrario — trazo claro
    sobre oscuro, y la comida dibujada en negativo.
  -->
  <defs>
    <linearGradient id="caliscan-hoja" x1="18" y1="46" x2="46" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fbe82" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4fbe82" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="caliscan-haz" x1="10" y1="32" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fbe82" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#4fbe82" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#4fbe82" stop-opacity="1"/>
      <stop offset="1" stop-color="#4fbe82" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- LA HOJA. Dos arcos opuestos: punta arriba a la derecha, base abajo a la
       izquierda. El contorno lleva el verde vivo; el interior, el mismo verde
       casi apagado, para que a tamaño pequeño gane la silueta. -->
  <path d="M18 46C18 30 30 18 46 18C46 34 34 46 18 46Z"
        fill="url(#caliscan-hoja)" stroke="#4fbe82" stroke-width="2.6"
        stroke-linejoin="round"/>

  <!-- La nervadura central, y NADA MÁS de nervadura. Se dibujaron dos venas
       laterales y se quitaron tras verlas a 32 px: con el haz cruzando ya hay
       dos líneas dentro de la hoja, y una tercera y una cuarta convertían el
       interior en un garabato. Verde profundo, un escalón por detrás del
       contorno, para que a tamaño pequeño gane la silueta. -->
  <path d="M18 46 46 18" stroke="#2f9e63" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- EL HAZ DE ESCANEO. Dos trazos superpuestos: uno ancho y tenue que hace de
       resplandor y otro fino y pleno que hace de línea. Sin filtro de desenfoque
       a propósito — un `feGaussianBlur` en un favicon se rasteriza mal y pesa. -->
  <g stroke="url(#caliscan-haz)" stroke-linecap="round" fill="none">
    <path d="M11 32H53" stroke-width="5" opacity="0.22"/>
    <path d="M11 32H53" stroke-width="2.2"/>
  </g>

  <!-- EL ENCUADRE. Cuatro esquinas, nunca un marco cerrado: un marco cerrado es
       una caja, cuatro esquinas son un visor apuntando. -->
  <g fill="none" stroke="#4fbe82" stroke-width="3.4" stroke-linecap="round">
    <path d="M21 4.5H12A7.5 7.5 0 0 0 4.5 12V21"/>
    <path d="M43 4.5H52A7.5 7.5 0 0 1 59.5 12V21"/>
    <path d="M59.5 43V52A7.5 7.5 0 0 1 52 59.5H43"/>
    <path d="M21 59.5H12A7.5 7.5 0 0 1 4.5 52V43"/>
  </g>
</svg>
