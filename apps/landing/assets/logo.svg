<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 64" width="252" height="64" role="img" aria-labelledby="caliscan-logo-titulo">
  <title id="caliscan-logo-titulo">CaliScan</title>
  <!--
    EL LOGOTIPO COMPLETO DE CALISCAN — isotipo + wordmark, en horizontal.

    El isotipo es el mismo dibujo de `logo-mark.svg` (el porqué de cada trazo
    está comentado allí); aquí va a la izquierda, a tamaño completo, y el
    nombre a su derecha.

    EL NOMBRE, PARTIDO EN DOS TINTAS: «Cali» en el color del texto y «Scan» en
    el verde de la marca. Es lo que hace el producto, dicho con color en vez de
    con una frase: se mide (calorías) escaneando. Y le da a la palabra un punto
    de anclaje visual — sin ese corte, «CaliScan» a tamaño pequeño se lee como
    una sola mancha.

    ⚠️ LA TIPOGRAFÍA. El wordmark usa `<text>`, no contornos: así el archivo
    pesa 2 KB, el texto es seleccionable y se puede recolorear con CSS. El
    precio es que la fuente tiene que estar disponible en el contexto donde se
    pinta. En la landing el SVG va EN LÍNEA dentro del HTML, que ya carga
    Bricolage Grotesque de Google Fonts, así que se ve como debe. Referenciado
    desde fuera (por ejemplo `<img src="logo.svg">`) el navegador no carga
    fuentes externas y cae a la pila de respaldo declarada abajo — sigue
    legible, pierde carácter. Si algún día hace falta el logo como imagen
    suelta e idéntica, se vectoriza el texto y se guarda como `logo-paths.svg`;
    hasta entonces, esto es lo correcto.

    Alto de referencia: 64 px. No usar por debajo de 24 px de alto — ahí el
    wordmark se cierra y toca ir con `logo-mark.svg` solo.
  -->
  <defs>
    <linearGradient id="caliscan-logo-hoja" x1="18" y1="46" x2="46" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fbe82" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4fbe82" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="caliscan-logo-haz" x1="10" y1="32" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fbe82" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#4fbe82" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#4fbe82" stop-opacity="1"/>
      <stop offset="1" stop-color="#4fbe82" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g>
    <path d="M18 46C18 30 30 18 46 18C46 34 34 46 18 46Z"
          fill="url(#caliscan-logo-hoja)" stroke="#4fbe82" stroke-width="2.6"
          stroke-linejoin="round"/>

    <path d="M18 46 46 18" stroke="#2f9e63" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <g stroke="url(#caliscan-logo-haz)" stroke-linecap="round" fill="none">
      <path d="M11 32H53" stroke-width="5" opacity="0.22"/>
      <path d="M11 32H53" stroke-width="2.2"/>
    </g>

    <g fill="none" stroke="#4fbe82" stroke-width="3.4" stroke-linecap="round">
      <path d="M21 4.5H12A7.5 7.5 0 0 0 4.5 12V21"/>
      <path d="M43 4.5H52A7.5 7.5 0 0 1 59.5 12V21"/>
      <path d="M59.5 43V52A7.5 7.5 0 0 1 52 59.5H43"/>
      <path d="M21 59.5H12A7.5 7.5 0 0 1 4.5 52V43"/>
    </g>
  </g>

  <text x="78" y="44.5"
        font-family="'Bricolage Grotesque', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="37" font-weight="700" letter-spacing="-0.9">
    <tspan fill="#e8ece4">Cali</tspan><tspan fill="#4fbe82">Scan</tspan>
  </text>
</svg>
