<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CaliScan">
  <title>CaliScan</title>
  <!--
    LA VARIANTE MASKABLE del ícono de CaliScan (ver icon.svg, que es la fuente
    de la explicación entera). Mismo dibujo, un solo cambio: el isotipo encoge
    al 62,5 % del lienzo (320 de 512, escala 5) para caber ENTERO en la zona
    segura — el círculo central del 80 % que Android garantiza visible bajo
    cualquier máscara. La cuenta: los vértices del visor quedan a
    27,5 × 5 × √2 ≈ 194 px del centro, por debajo del radio seguro de 204,8.
    El fondo sí va a sangre completa: es lo que la máscara recorta.
  -->
  <defs>
    <linearGradient id="caliscan-hoja-m" x1="18" y1="46" x2="46" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fbe82" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4fbe82" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="caliscan-haz-m" x1="10" y1="32" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fbe82" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#4fbe82" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#4fbe82" stop-opacity="1"/>
      <stop offset="1" stop-color="#4fbe82" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#12160f"/>

  <g transform="translate(96 96) scale(5)">
    <path d="M18 46C18 30 30 18 46 18C46 34 34 46 18 46Z"
          fill="url(#caliscan-hoja-m)" stroke="#4fbe82" stroke-width="2.6"
          stroke-linejoin="round"/>
    <path d="M18 46 46 18" stroke="#2f9e63" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <g stroke="url(#caliscan-haz-m)" stroke-linecap="round" fill="none">
      <path d="M11 32H53" stroke-width="5" opacity="0.22"/>
      <path d="M11 32H53" stroke-width="2.2"/>
    </g>
    <g fill="none" stroke="#4fbe82" stroke-width="3.4" stroke-linecap="round">
      <path d="M21 4.5H12A7.5 7.5 0 0 0 4.5 12V21"/>
      <path d="M43 4.5H52A7.5 7.5 0 0 1 59.5 12V21"/>
      <path d="M59.5 43V52A7.5 7.5 0 0 1 52 59.5H43"/>
      <path d="M21 59.5H12A7.5 7.5 0 0 1 4.5 52V43"/>
    </g>
  </g>
</svg>
