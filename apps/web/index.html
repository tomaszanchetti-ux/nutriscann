<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12160f" />
    <meta
      name="description"
      content="Haz una foto de tu plato y conoce su valor nutricional al instante."
    />

    <!-- LA IDENTIDAD (card 3.4, DT-5). El dibujo y su porqué están en
         public/icon.svg; acá solo se declara dónde mirar.

         El orden importa: el SVG va primero para el navegador que lo entienda
         (uno solo, nítido a cualquier tamaño) y los PNG quedan de respaldo para
         el que no. `apple-touch-icon` es aparte porque iOS no lee el manifiesto
         para esto: si no está declarado en el HTML, guarda una captura de la
         página como ícono. -->
    <!-- El `?v=` es el rompe-caché del cambio de marca (02/09/2026): Safari
         cachea el apple-touch-icon con ganas y sin esto un iPhone que ya
         visitó la app puede re-instalarla con el ícono viejo. Si el ícono
         vuelve a cambiar, se sube la versión acá y en el manifest. -->
    <link rel="icon" href="/icon.svg?v=caliscan1" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=caliscan1" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png?v=caliscan1" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=caliscan1" sizes="180x180" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS abre la app a pantalla completa como la PWA que es, con la barra de
         estado en claro sobre el fondo oscuro del sistema visual. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CaliScan" />

    <!-- LA TARJETA DE COMPARTIR (Q/A de Tomás, 02/09/2026). Es lo que WhatsApp,
         iMessage o Telegram dibujan cuando alguien pega el enlace de la app:
         sin esto, el enlace viaja pelado — ni imagen, ni nombre. La imagen es
         la misma de la landing (una sola cara de marca), recomprimida a JPEG
         de ~100 KB porque WhatsApp descarta imágenes de vista previa pesadas.
         Las URL son ABSOLUTAS a propósito: quien las lee es el servidor de la
         app de mensajería, no el navegador. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CaliScan" />
    <meta property="og:title" content="CaliScan — Haz una foto a tu plato" />
    <meta
      property="og:description"
      content="Conoce las calorías y los macros de tu comida al instante, con cada número trazable a la base nutricional del USDA."
    />
    <meta property="og:url" content="https://app.caliscan.app/" />
    <meta property="og:image" content="https://app.caliscan.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=Spline+Sans+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>CaliScan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
