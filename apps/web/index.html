<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12160f" />
    <meta
      name="description"
      content="Haz una foto de tu plato y conoce su valor nutricional al instante."
    />

    <!-- LA IDENTIDAD (card 3.4, DT-5). El dibujo y su porqué están en
         public/icon.svg; acá solo se declara dónde mirar.

         El orden importa: el SVG va primero para el navegador que lo entienda
         (uno solo, nítido a cualquier tamaño) y los PNG quedan de respaldo para
         el que no. `apple-touch-icon` es aparte porque iOS no lee el manifiesto
         para esto: si no está declarado en el HTML, guarda una captura de la
         página como ícono. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS abre la app a pantalla completa como la PWA que es, con la barra de
         estado en claro sobre el fondo oscuro del sistema visual. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NutriScann" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=Spline+Sans+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>NutriScann</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
